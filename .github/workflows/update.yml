name: Daily Catalog Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-llms:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl

      - name: Run generator script
        run: |
          if [ -f "generate_llms.py" ]; then
            python generate_llms.py
          elif [ -f "E-Push.AI/generate_llms.py" ]; then
            cd E-Push.AI && python generate_llms.py
          else
            find . -name "generate_llms.py" -exec python {} \;
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-update llms.txt from Google Sheets" || exit 0
          git push
